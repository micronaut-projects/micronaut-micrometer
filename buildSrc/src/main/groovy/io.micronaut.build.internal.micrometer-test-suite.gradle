/*
 * Convention for the documentation test suites (test-suite, test-suite-groovy, test-suite-kotlin,
 * test-suite-python). The user guide `snippet::` macros resolve their sources in these projects,
 * so every example is compiled and tested in all four languages.
 */
plugins {
    id 'java'
    id 'io.micronaut.build.internal.micrometer-base'
}

group "io.micronaut.micrometer.example"

dependencies {
    testImplementation projects.micronautMicrometerCore
    testImplementation mn.micronaut.inject
    testImplementation mn.micronaut.context
    testImplementation mn.micronaut.http.client
    testImplementation mn.micronaut.http.server.netty
    testImplementation mn.micronaut.management
    testImplementation mn.reactor
    testImplementation mnSerde.micronaut.serde.jackson
    testImplementation mnValidation.micronaut.validation
    testImplementation mnTest.micronaut.test.junit5

    testRuntimeOnly mn.snakeyaml
    testRuntimeOnly mnLogging.logback.classic
    testRuntimeOnly mnTest.junit.jupiter.engine
    testRuntimeOnly mnTest.junit.platform.launcher
}

configurations.all {
    resolutionStrategy.preferProjectModules()
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
