/**
 * Defines common configuration for all Micrometer modules.
 */
plugins {
    id 'io.micronaut.build.internal.micrometer-base'
    id 'io.micronaut.build.internal.module'
    id("org.sonatype.gradle.plugins.scan")
}
String ossIndexUsername = System.getenv("OSS_INDEX_USERNAME") ?: project.properties["ossIndexUsername"]
String ossIndexPassword = System.getenv("OSS_INDEX_PASSWORD") ?: project.properties["ossIndexPassword"]
boolean sonatypePluginConfigured = ossIndexUsername != null && ossIndexPassword != null
if (sonatypePluginConfigured) {
    ossIndexAudit {
        username = ossIndexUsername
        password = ossIndexPassword
        excludeVulnerabilityIds = [
                'CVE-2024-23082', // disputed / false position. See https://www.threeten.org/threetenbp/security.html
                'CVE-2024-23081' // disputed / false position. See https://www.threeten.org/threetenbp/security.html
        ]
        excludeCoordinates = [
                "org.threeten:threetenbp:1.7.1", // no version patched https://ossindex.sonatype.org/component/pkg:maven/org.threeten/threetenbp
        ]
    }
}

dependencies {
    api libs.managed.micrometer.core
}
