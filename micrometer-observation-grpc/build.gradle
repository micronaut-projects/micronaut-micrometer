plugins {
    id 'io.micronaut.build.internal.micrometer-module'
}

dependencies {
    annotationProcessor mn.micronaut.graal

    api projects.micronautMicrometerObservation
    implementation libs.managed.micrometer.observation
    implementation(platform(mnGrpc.boms.grpc))
    compileOnly(libs.grpc.api)

    testAnnotationProcessor mn.micronaut.inject.java
    testImplementation(libs.managed.micrometer.observation.test) {
        exclude group: 'org.junit.jupiter', module: 'junit-jupiter'
    }
    testImplementation projects.micronautMicrometerCore
    testImplementation mnGrpc.micronaut.grpc.server.runtime
    testImplementation mnGrpc.micronaut.grpc.client.runtime
    testImplementation mn.micronaut.runtime
}

micronautBuild {
    binaryCompatibility {
        enabledAfter '6.1.3'
    }
}
