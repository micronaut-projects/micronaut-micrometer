plugins {
    id 'io.micronaut.build.internal.micrometer-registry'
}

dependencies {
    api libs.micrometer.registry.prometheus
    // a runtime dependency of micrometer-registry-prometheus, used by the endpoint to select the format
    compileOnly libs.prometheus.metrics.exposition.textformats
    testImplementation(mnSerde.micronaut.serde.jackson)
}
