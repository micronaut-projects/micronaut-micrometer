# Builds 6.2.x and the pull requests stacked on it against Micronaut Core built from source
# (Gradle --include-build), so changes and regressions in the next core minor show up here first.
# Not part of the project template: remove once the build moves to a published core 5.3 release.
name: Core from source
on:
  push:
    branches:
      - '6.2.x'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      core-ref:
        description: 'micronaut-core branch, tag or commit to build against'
        required: false
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  build:
    name: "build (core ${{ inputs.core-ref || vars.CORE_REF || '5.3.x' }})"
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      CORE_REF: ${{ inputs.core-ref || vars.CORE_REF || '5.3.x' }}
      TESTCONTAINERS_RYUK_DISABLED: true
      ORG_GRADLE_PROJECT_cachePush: false
    steps:
      - name: "🗑 Free disk space"
        run: |
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo rm -rf "/opt/ghc"
          sudo rm -rf "/usr/share/dotnet"
          sudo rm -rf "/usr/local/lib/android"
          sudo apt-get clean

      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Pull requests run this job only when they are stacked on 6.2.x: their base can be another
      # pull request's branch, so the base name alone does not tell.
      - name: "🔎 Check the change is based on 6.2.x"
        id: stacked
        run: |
          if git merge-base --is-ancestor origin/6.2.x HEAD; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not based on 6.2.x: skipping the core-from-source build."
          fi

      - name: "📥 Checkout micronaut-core"
        if: steps.stacked.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: micronaut-projects/micronaut-core
          ref: ${{ env.CORE_REF }}
          path: micronaut-core

      - name: "📦 Move micronaut-core next to the repository"
        if: steps.stacked.outputs.run == 'true'
        run: |
          mv micronaut-core ../micronaut-core
          echo "Building against micronaut-core $(git -C ../micronaut-core rev-parse --short HEAD) ($CORE_REF)"

      - name: "🔧 Setup GraalVM CE"
        if: steps.stacked.outputs.run == 'true'
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          distribution: 'graalvm'
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔧 Setup Gradle"
        if: steps.stacked.outputs.run == 'true'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          develocity-access-key: >-
            ${{ (github.event_name == 'push' && secrets.GRADLE_ENTERPRISE_ACCESS_KEY) ||
                (github.event_name != 'push' && (secrets.DEVELOCITY_PULL_REQUEST_ACCESS_KEY || secrets.GRADLE_ENTERPRISE_ACCESS_KEY)) ||
                '' }}

      - name: "🛠 Build with Gradle against micronaut-core from source"
        if: steps.stacked.outputs.run == 'true'
        run: |
          ./gradlew --include-build ../micronaut-core check --no-daemon --continue

      - name: "📊 Publish Test Report"
        if: always() && steps.stacked.outputs.run == 'true'
        uses: mikepenz/action-junit-report@a9170d5795813c01ab4901ffb045b52bab4ab09d # v6
        with:
          check_name: Core from source / Test Report
          report_paths: '**/build/test-results/test/TEST-*.xml'
          check_retries: 'true'
