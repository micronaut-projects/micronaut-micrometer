plugins {
    id 'io.micronaut.build.internal.micrometer-registry'
}

dependencies {
    api libs.micrometer.registry.otlp
    implementation(mnGrpc.protobuf.java) // apply com.google.protobuf:protobuf-java directly because the version brought transitively contains a vulnerable version.
    // exemplars are sampled from the current Micrometer Tracing span when a Tracer bean exists
    compileOnly libs.managed.micrometer.tracing
    testImplementation libs.managed.micrometer.tracing
}
