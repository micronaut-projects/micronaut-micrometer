plugins {
    id 'io.micronaut.build.internal.micrometer-module'
}

dependencies {
    annotationProcessor mn.micronaut.graal

    api libs.managed.datasource.micrometer
    implementation libs.managed.micrometer.observation
    implementation mnData.micronaut.data.connection.jdbc
    compileOnly(mnSql.micronaut.jdbc.hikari)

    testAnnotationProcessor mn.micronaut.inject.java
    testAnnotationProcessor projects.micronautMicrometerAnnotation
    testAnnotationProcessor mnData.micronaut.data.processor
    testImplementation libs.managed.micrometer.observation.test
    testImplementation projects.micronautMicrometerCore
    testImplementation mnData.micronaut.data.jdbc
    testImplementation mnSql.micronaut.jdbc.tomcat
    testImplementation libs.managed.micrometer.tracing

    testRuntimeOnly mnSql.h2
}

micronautBuild {
    binaryCompatibility {
        enabled.set(false)
    }
}
