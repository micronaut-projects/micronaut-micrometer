pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id('io.micronaut.build.shared.settings') version '8.1.4'
}

rootProject.name = 'micrometer-parent'

include 'micrometer-annotation'
include 'micrometer-bom'
include 'micrometer-core'
include 'micrometer-observation'
include 'micrometer-observation-datasource'
include 'micrometer-observation-http'
include 'micrometer-registry-appoptics'
include 'micrometer-registry-atlas'
include 'micrometer-registry-azure-monitor'
include 'micrometer-registry-cloudwatch'
include 'micrometer-registry-datadog'
include 'micrometer-registry-dynatrace'
include 'micrometer-registry-elastic'
include 'micrometer-registry-ganglia'
include 'micrometer-registry-graphite'
include 'micrometer-registry-humio'
include 'micrometer-registry-influx'
include 'micrometer-registry-jmx'
include 'micrometer-registry-kairos'
include 'micrometer-registry-new-relic'
include 'micrometer-registry-new-relic-telemetry'
include 'micrometer-registry-otlp'
include 'micrometer-registry-prometheus'
include 'micrometer-registry-prometheus-pushgateway'
include 'micrometer-registry-signalfx'
include 'micrometer-registry-stackdriver'
include 'micrometer-registry-statsd'
include 'test-suite:micronaut-serialization'
include 'test-suite:test-observation-datasource'
include 'test-suite:test-prometheus-graal'

// documentation test suites (sources of the user guide `snippet::` macros)
include 'test-suite'
include 'test-suite-groovy'
include 'test-suite-kotlin'
include 'test-suite-python'

// micrometer-observation-kafka implements the KafkaConsumerProcessingObserver SPI that is not in a
// micronaut-kafka release yet (micronaut-projects/micronaut-kafka#1407). Pass -PkafkaObservation to include
// it, with --include-build <path-to-micronaut-kafka> pointing at a checkout that has the SPI.
if (providers.gradleProperty("kafkaObservation").present) {
    include 'micrometer-observation-kafka'
}

enableFeaturePreview 'TYPESAFE_PROJECT_ACCESSORS'

micronautBuild {
    useStandardizedProjectNames = true
    importMicronautCatalog()
    importMicronautCatalog("micronaut-aws")
    importMicronautCatalog("micronaut-cache")
    importMicronautCatalog("micronaut-grpc")
    importMicronautCatalog("micronaut-kafka")
    importMicronautCatalog("micronaut-r2dbc")
    importMicronautCatalog("micronaut-rxjava3")
    importMicronautCatalog("micronaut-serde")
    importMicronautCatalog("micronaut-sql")
    importMicronautCatalog("micronaut-data")
    importMicronautCatalog("micronaut-validation")
    importMicronautCatalog("micronaut-reactor")
}

// Micronaut Core 5.3.0-SNAPSHOT comes from the Central snapshots repository. Only io.micronaut
// snapshots are resolved from it. Projects declare their own repositories, which replace the
// settings ones, so it is added to each project too. To build against a core checkout instead,
// pass --include-build <path-to-micronaut-core>. Remove once the build moves to a core release.
// test-suite-dev-reload runs against micronaut-dev-tck, which is not in core 5.3.x yet: it comes from the
// development mode stack (micronaut-projects/micronaut-core#13575). Publish that stack to Maven local with
// publishToMavenLocal and pass -PdevReload to include the suite and resolve io.micronaut snapshots from
// Maven local first.
def devReload = providers.gradleProperty("devReload").present
if (devReload) {
    include 'test-suite-dev-reload'
}
def micronautSnapshotRepositories = { RepositoryHandler repositories ->
    if (devReload) {
        repositories.mavenLocal {
            content {
                includeVersionByRegex("io\\.micronaut(\\..*)?", ".*", ".*-SNAPSHOT")
            }
        }
    }
    repositories.maven {
        url = "https://central.sonatype.com/repository/maven-snapshots/"
        mavenContent {
            snapshotsOnly()
        }
        content {
            includeGroupByRegex("io\\.micronaut(\\..*)?")
        }
    }
}
dependencyResolutionManagement {
    micronautSnapshotRepositories(repositories)
    repositories {
        mavenCentral()
    }
}
gradle.beforeProject {
    micronautSnapshotRepositories(it.repositories)
}
