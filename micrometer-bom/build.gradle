plugins {
    id 'io.micronaut.build.internal.bom'
}

micronautBom {
    suppressions {
        dependencies.addAll([
                // bomCheck fails because io.micrometer:concurrency-tests is in the bom, but isn't a published artifact.
                // See: https://github.com/micrometer-metrics/micrometer/issues/5395
                "io.micrometer:concurrency-tests:${libs.versions.managed.micrometer.asProvider().get()}",
        ])
        acceptedVersionRegressions.addAll([
                // Removed with the Jackson 2 BOM while moving to the Jackson 3 baseline.
                "jackson",
        ])
        acceptedLibraryRegressions.addAll([
                // Removed with the Jackson 2 BOM while moving to the Jackson 3 baseline.
                "boms-jackson",
                // Wavefront is end-of-life and the registry module has been removed.
                "micronaut-micrometer-registry-wavefront",
        ])
    }
}
